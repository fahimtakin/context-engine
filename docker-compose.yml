# Local development: API + Qdrant + Redis Stack. Ollama runs on the host.
services:
  app:
    build: .
    container_name: context_engine_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./documents:/app/documents
    env_file:
      - path: .env
        required: false
    environment:
      DOCKER_CONTAINER: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_HOST: redis
      REDIS_PORT: 6379 # container-internal port (published to the host as 6380)
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: context_engine_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis/redis-stack-server:latest
    container_name: context_engine_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  redis_data:
