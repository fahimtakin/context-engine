# Production-style stack: same services, but Qdrant and Redis are only reachable
# inside the Docker network (no published ports).
services:
  app:
    build: .
    container_name: context_engine_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./documents:/app/documents
    env_file:
      - path: .env
        required: false
    environment:
      DOCKER_CONTAINER: "true"
      LOG_LEVEL: INFO
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis/redis-stack-server:latest
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_data:
  redis_data:
